services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env.compose.local
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5433:5432"
    volumes:
      - timeyou-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  focus-service:
    build:
      context: ./services/focus-service
      dockerfile: Dockerfile
    env_file:
      - .env.compose.local
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      COGNITO_REGION: ${COGNITO_REGION:?COGNITO_REGION is required}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:?COGNITO_USER_POOL_ID is required}
      COGNITO_APP_CLIENT_ID: ${COGNITO_APP_CLIENT_ID:?COGNITO_APP_CLIENT_ID is required}
      FOCUS_INTERNAL_API_KEY: ${FOCUS_INTERNAL_API_KEY:?FOCUS_INTERNAL_API_KEY is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  analytics-service:
    build:
      context: ./services/analytics-service
      dockerfile: Dockerfile
    env_file:
      - .env.compose.local
    environment:
      COGNITO_REGION: ${COGNITO_REGION:?COGNITO_REGION is required}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:?COGNITO_USER_POOL_ID is required}
      COGNITO_APP_CLIENT_ID: ${COGNITO_APP_CLIENT_ID:?COGNITO_APP_CLIENT_ID is required}
      FOCUS_SERVICE_URL: http://focus-service:8000
      FOCUS_INTERNAL_API_KEY: ${FOCUS_INTERNAL_API_KEY:?FOCUS_INTERNAL_API_KEY is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
    ports:
      - "8001:8001"
    depends_on:
      focus-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - .env.compose.local
    environment:
      NEXT_PUBLIC_COGNITO_ISSUER: ${NEXT_PUBLIC_COGNITO_ISSUER:?NEXT_PUBLIC_COGNITO_ISSUER is required}
      NEXT_PUBLIC_COGNITO_CLIENT_ID: ${NEXT_PUBLIC_COGNITO_CLIENT_ID:?NEXT_PUBLIC_COGNITO_CLIENT_ID is required}
      NEXT_PUBLIC_COGNITO_REDIRECT_URI: ${NEXT_PUBLIC_COGNITO_REDIRECT_URI:?NEXT_PUBLIC_COGNITO_REDIRECT_URI is required}
      NEXT_PUBLIC_COGNITO_LOGOUT_URI: ${NEXT_PUBLIC_COGNITO_LOGOUT_URI:?NEXT_PUBLIC_COGNITO_LOGOUT_URI is required}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_ANALYTICS_API_BASE_URL: ${NEXT_PUBLIC_ANALYTICS_API_BASE_URL:-http://localhost:8001}
    ports:
      - "3001:3000"
    depends_on:
      focus-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy

volumes:
  timeyou-postgres:
    name: timeyou-postgres-local
