name: CI

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - frontend/**
      - services/**

permissions:
  contents: read

jobs:
  quality:
    name: Quality and build checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_ANALYTICS_API_BASE_URL: ${{ vars.NEXT_PUBLIC_ANALYTICS_API_BASE_URL }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ vars.NEXT_PUBLIC_COGNITO_CLIENT_ID }}
          NEXT_PUBLIC_COGNITO_DOMAIN: ${{ vars.NEXT_PUBLIC_COGNITO_DOMAIN }}
          NEXT_PUBLIC_COGNITO_ISSUER: ${{ vars.NEXT_PUBLIC_COGNITO_ISSUER }}
          NEXT_PUBLIC_COGNITO_LOGOUT_URI: ${{ vars.NEXT_PUBLIC_COGNITO_LOGOUT_URI }}
          NEXT_PUBLIC_COGNITO_REDIRECT_URI: ${{ vars.NEXT_PUBLIC_COGNITO_REDIRECT_URI }}
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Focus Service
        working-directory: services/focus-service
        run: |
          python -m pip install --upgrade pip
          pip install \
            "fastapi>=0.115,<1.0" \
            "pydantic>=2.9,<3.0" \
            "PyJWT[crypto]>=2.9,<3.0" \
            "sqlalchemy>=2.0,<3.0" \
            "psycopg[binary]>=3.2,<4.0" \
            "alembic>=1.14,<2.0" \
            "uvicorn[standard]>=0.30,<1.0"
          python -m compileall -q app migrations

      - name: Check Analytics Service
        working-directory: services/analytics-service
        run: |
          python -m pip install --upgrade pip
          pip install \
            "fastapi>=0.115,<1.0" \
            "httpx>=0.27,<1.0" \
            "pydantic>=2.9,<3.0" \
            "PyJWT[crypto]>=2.9,<3.0" \
            "uvicorn[standard]>=0.30,<1.0"
          python -m compileall -q app

  publish:
    name: Build and push images
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/timeyou-frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_ANALYTICS_API_BASE_URL=${{ vars.NEXT_PUBLIC_ANALYTICS_API_BASE_URL }}
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_COGNITO_CLIENT_ID=${{ vars.NEXT_PUBLIC_COGNITO_CLIENT_ID }}
            NEXT_PUBLIC_COGNITO_DOMAIN=${{ vars.NEXT_PUBLIC_COGNITO_DOMAIN }}
            NEXT_PUBLIC_COGNITO_ISSUER=${{ vars.NEXT_PUBLIC_COGNITO_ISSUER }}
            NEXT_PUBLIC_COGNITO_LOGOUT_URI=${{ vars.NEXT_PUBLIC_COGNITO_LOGOUT_URI }}
            NEXT_PUBLIC_COGNITO_REDIRECT_URI=${{ vars.NEXT_PUBLIC_COGNITO_REDIRECT_URI }}

      - name: Build and push Focus Service image
        uses: docker/build-push-action@v6
        with:
          context: ./services/focus-service
          file: ./services/focus-service/Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/timeyou-focus:${{ github.sha }}

      - name: Build and push Analytics Service image
        uses: docker/build-push-action@v6
        with:
          context: ./services/analytics-service
          file: ./services/analytics-service/Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/timeyou-analytics:${{ github.sha }}

      - name: Resolve pushed image digests
        id: image-digests
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          frontend_digest="$(aws ecr describe-images --repository-name timeyou-frontend --image-ids imageTag="$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text)"
          focus_digest="$(aws ecr describe-images --repository-name timeyou-focus --image-ids imageTag="$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text)"
          analytics_digest="$(aws ecr describe-images --repository-name timeyou-analytics --image-ids imageTag="$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text)"

          test "$frontend_digest" != "None"
          test "$focus_digest" != "None"
          test "$analytics_digest" != "None"

          echo "frontend=$frontend_digest" >> "$GITHUB_OUTPUT"
          echo "focus=$focus_digest" >> "$GITHUB_OUTPUT"
          echo "analytics=$analytics_digest" >> "$GITHUB_OUTPUT"

      - name: Update dev image digests and open PR
        env:
          GH_TOKEN: ${{ github.token }}
          FRONTEND_DIGEST: ${{ steps.image-digests.outputs.frontend }}
          FOCUS_DIGEST: ${{ steps.image-digests.outputs.focus }}
          ANALYTICS_DIGEST: ${{ steps.image-digests.outputs.analytics }}
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA:0:12}"
          branch="ci/update-dev-images-${short_sha}"
          commit_message="Update dev image digests for ${short_sha}"
          pr_title="Update dev images for ${short_sha}"
          values_file="deploy/environments/dev/values.yaml"

          gh auth setup-git
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
          else
            git checkout -B "$branch" origin/main
          fi

          VALUES_FILE="$values_file" \
          FRONTEND_DIGEST="$FRONTEND_DIGEST" \
          FOCUS_DIGEST="$FOCUS_DIGEST" \
          ANALYTICS_DIGEST="$ANALYTICS_DIGEST" \
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["VALUES_FILE"])
          lines = path.read_text().splitlines(keepends=True)
          original = list(lines)

          replacements = {
              "frontend": os.environ["FRONTEND_DIGEST"],
              "focus": os.environ["FOCUS_DIGEST"],
              "analytics": os.environ["ANALYTICS_DIGEST"],
          }

          def is_digest(value):
              return value.startswith("sha256:") and len(value) == 71 and all(
                  character in "0123456789abcdef" for character in value[7:]
              )

          in_images = False
          current_image = None
          digest_indexes = {}

          for index, line in enumerate(lines):
              content = line.rstrip("\r\n")

              if content == "images:":
                  in_images = True
                  current_image = None
                  continue

              if not in_images:
                  continue

              if content and not content.startswith(" "):
                  in_images = False
                  current_image = None
                  continue

              if line.startswith("  ") and not line.startswith("    ") and content.endswith(":"):
                  image_name = content[2:-1]
                  current_image = image_name if image_name in replacements else None
                  continue

              if current_image and line.startswith("    digest: "):
                  if current_image in digest_indexes:
                      raise SystemExit(f"Duplicate {current_image} digest field")
                  current_digest = content.removeprefix("    digest: ")
                  if not is_digest(current_digest):
                      raise SystemExit(f"Invalid {current_image} digest field")
                  digest_indexes[current_image] = index
                  lines[index] = f"    digest: {replacements[current_image]}\n"

          if set(digest_indexes) != set(replacements):
              missing = sorted(set(replacements) - set(digest_indexes))
              raise SystemExit(f"Expected exactly one digest field for each image; missing: {missing}")

          changed_indexes = {
              index for index, (before, after) in enumerate(zip(original, lines)) if before != after
          }
          if changed_indexes != set(digest_indexes.values()):
              raise SystemExit("Unexpected non-digest change in environments/dev/values.yaml")

          path.write_text("".join(lines))
          PY

          if git diff --quiet -- "$values_file"; then
            echo "Dev image digests are already up to date; no PR needed."
            exit 0
          fi

          diff="$(git diff --unified=0 -- "$values_file")"
          changed_lines="$(printf '%s\n' "$diff" | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' || true)"
          changed_count="$(printf '%s\n' "$changed_lines" | sed '/^$/d' | wc -l | tr -d ' ')"
          test "$changed_count" -eq 6
          if printf '%s\n' "$changed_lines" | grep -Ev '^[-+]    digest: sha256:[0-9a-f]+$' >/dev/null; then
            echo "Unexpected non-digest change in ${values_file}" >&2
            exit 1
          fi

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$values_file"
          git commit -m "$commit_message"
          git push --set-upstream origin "$branch"

          existing_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$branch" --json number --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" --repo "$GITHUB_REPOSITORY" --title "$pr_title" --body "Automated dev image digest update for ${GITHUB_SHA}."
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "$pr_title" --body "Automated dev image digest update for ${GITHUB_SHA}."
          fi
