name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality and build checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_ANALYTICS_API_BASE_URL: ${{ vars.NEXT_PUBLIC_ANALYTICS_API_BASE_URL }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ vars.NEXT_PUBLIC_COGNITO_CLIENT_ID }}
          NEXT_PUBLIC_COGNITO_DOMAIN: ${{ vars.NEXT_PUBLIC_COGNITO_DOMAIN }}
          NEXT_PUBLIC_COGNITO_ISSUER: ${{ vars.NEXT_PUBLIC_COGNITO_ISSUER }}
          NEXT_PUBLIC_COGNITO_LOGOUT_URI: ${{ vars.NEXT_PUBLIC_COGNITO_LOGOUT_URI }}
          NEXT_PUBLIC_COGNITO_REDIRECT_URI: ${{ vars.NEXT_PUBLIC_COGNITO_REDIRECT_URI }}
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Focus Service
        working-directory: services/focus-service
        run: |
          python -m pip install --upgrade pip
          pip install \
            "fastapi>=0.115,<1.0" \
            "pydantic>=2.9,<3.0" \
            "PyJWT[crypto]>=2.9,<3.0" \
            "sqlalchemy>=2.0,<3.0" \
            "psycopg[binary]>=3.2,<4.0" \
            "alembic>=1.14,<2.0" \
            "uvicorn[standard]>=0.30,<1.0"
          python -m compileall -q app migrations

      - name: Check Analytics Service
        working-directory: services/analytics-service
        run: |
          python -m pip install --upgrade pip
          pip install \
            "fastapi>=0.115,<1.0" \
            "httpx>=0.27,<1.0" \
            "pydantic>=2.9,<3.0" \
            "PyJWT[crypto]>=2.9,<3.0" \
            "uvicorn[standard]>=0.30,<1.0"
          python -m compileall -q app

  publish:
    name: Build and push images
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/timeyou-frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_ANALYTICS_API_BASE_URL=${{ vars.NEXT_PUBLIC_ANALYTICS_API_BASE_URL }}
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_COGNITO_CLIENT_ID=${{ vars.NEXT_PUBLIC_COGNITO_CLIENT_ID }}
            NEXT_PUBLIC_COGNITO_DOMAIN=${{ vars.NEXT_PUBLIC_COGNITO_DOMAIN }}
            NEXT_PUBLIC_COGNITO_ISSUER=${{ vars.NEXT_PUBLIC_COGNITO_ISSUER }}
            NEXT_PUBLIC_COGNITO_LOGOUT_URI=${{ vars.NEXT_PUBLIC_COGNITO_LOGOUT_URI }}
            NEXT_PUBLIC_COGNITO_REDIRECT_URI=${{ vars.NEXT_PUBLIC_COGNITO_REDIRECT_URI }}

      - name: Build and push Focus Service image
        uses: docker/build-push-action@v6
        with:
          context: ./services/focus-service
          file: ./services/focus-service/Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/timeyou-focus:${{ github.sha }}

      - name: Build and push Analytics Service image
        uses: docker/build-push-action@v6
        with:
          context: ./services/analytics-service
          file: ./services/analytics-service/Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/timeyou-analytics:${{ github.sha }}

      - name: Verify pushed image references
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws ecr describe-images --repository-name timeyou-frontend --image-ids imageTag="$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text
          aws ecr describe-images --repository-name timeyou-focus --image-ids imageTag="$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text
          aws ecr describe-images --repository-name timeyou-analytics --image-ids imageTag="$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text
