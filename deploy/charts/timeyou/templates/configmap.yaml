apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "timeyou.fullname" . }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "timeyou.labels" . | nindent 4 }}
data:
  COGNITO_REGION: {{ .Values.cognito.region | quote }}
  COGNITO_USER_POOL_ID: {{ .Values.cognito.userPoolId | quote }}
  COGNITO_APP_CLIENT_ID: {{ .Values.cognito.appClientId | quote }}
  COGNITO_ISSUER: {{ .Values.cognito.issuer | quote }}
  CORS_ORIGIN: {{ .Values.focus.corsOrigin | quote }}
  FOCUS_SERVICE_URL: {{ printf "http://%s-focus:%d" (include "timeyou.fullname" .) (int .Values.focus.service.port) | quote }}
  NEXT_PUBLIC_COGNITO_ISSUER: {{ .Values.cognito.issuer | quote }}
  NEXT_PUBLIC_COGNITO_CLIENT_ID: {{ .Values.cognito.appClientId | quote }}
  NEXT_PUBLIC_COGNITO_REDIRECT_URI: {{ .Values.cognito.redirectUri | quote }}
  NEXT_PUBLIC_COGNITO_LOGOUT_URI: {{ .Values.cognito.logoutUri | quote }}
  NEXT_PUBLIC_API_BASE_URL: {{ .Values.frontend.apiBaseUrl | quote }}
  NEXT_PUBLIC_ANALYTICS_API_BASE_URL: {{ .Values.frontend.analyticsApiBaseUrl | quote }}
