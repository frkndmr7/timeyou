apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "timeyou.fullname" . }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "timeyou.labels" . | nindent 4 }}
data:
  COGNITO_REGION: {{ required "cognito.region must be supplied by environment values" .Values.cognito.region | quote }}
  COGNITO_USER_POOL_ID: {{ required "cognito.userPoolId must be supplied by environment values" .Values.cognito.userPoolId | quote }}
  COGNITO_APP_CLIENT_ID: {{ required "cognito.appClientId must be supplied by environment values" .Values.cognito.appClientId | quote }}
  COGNITO_ISSUER: {{ required "cognito.issuer must be supplied by environment values" .Values.cognito.issuer | quote }}
  CORS_ORIGIN: {{ required "focus.corsOrigin must be supplied by environment values" .Values.focus.corsOrigin | quote }}
  FOCUS_SERVICE_URL: {{ printf "http://%s-focus:%d" (include "timeyou.fullname" .) (int .Values.focus.service.port) | quote }}
  NEXT_PUBLIC_COGNITO_ISSUER: {{ required "cognito.issuer must be supplied by environment values" .Values.cognito.issuer | quote }}
  NEXT_PUBLIC_COGNITO_CLIENT_ID: {{ required "cognito.appClientId must be supplied by environment values" .Values.cognito.appClientId | quote }}
  NEXT_PUBLIC_COGNITO_REDIRECT_URI: {{ required "cognito.redirectUri must be supplied by environment values" .Values.cognito.redirectUri | quote }}
  NEXT_PUBLIC_COGNITO_LOGOUT_URI: {{ required "cognito.logoutUri must be supplied by environment values" .Values.cognito.logoutUri | quote }}
  NEXT_PUBLIC_COGNITO_MANAGED_LOGIN_URL: {{ required "cognito.managedLoginUrl must be supplied by environment values" .Values.cognito.managedLoginUrl | quote }}
  NEXT_PUBLIC_API_BASE_URL: {{ required "frontend.apiBaseUrl must be supplied by environment values" .Values.frontend.apiBaseUrl | quote }}
  NEXT_PUBLIC_ANALYTICS_API_BASE_URL: {{ required "frontend.analyticsApiBaseUrl must be supplied by environment values" .Values.frontend.analyticsApiBaseUrl | quote }}
