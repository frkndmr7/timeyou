apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "timeyou.fullname" . }}-analytics
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "timeyou.labels" . | nindent 4 }}
    app.kubernetes.io/component: analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "timeyou.name" . }}
      app.kubernetes.io/component: analytics
  template:
    metadata:
      labels:
        {{- include "timeyou.labels" . | nindent 8 }}
        app.kubernetes.io/component: analytics
    spec:
      containers:
        - name: analytics
          image: "{{ include "timeyou.image" .Values.images.analytics }}"
          imagePullPolicy: {{ .Values.images.analytics.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.analytics.service.port }}
          envFrom:
            - configMapRef:
                name: {{ include "timeyou.fullname" . }}-config
          env:
            - name: FOCUS_INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: {{ .Values.existingSecret.internalApiKeyKey }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.analytics.resources | nindent 12 }}
