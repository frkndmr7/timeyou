namespace: timeyou

ingress:
  enabled: false
  className: alb
  annotations: {}

images:
  frontend:
    repository: ""
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  focus:
    repository: ""
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  analytics:
    repository: ""
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent

cognito:
  region: ""
  userPoolId: ""
  appClientId: ""
  issuer: ""
  redirectUri: ""
  logoutUri: ""
  managedLoginUrl: ""

frontend:
  apiBaseUrl: ""
  analyticsApiBaseUrl: ""
  service:
    port: 3000
    annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 512Mi

focus:
  service:
    port: 8000
    annotations: {}
  serviceMonitor:
    enabled: false
    interval: 30s
  corsOrigin: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

analytics:
  service:
    port: 8001
    annotations: {}
  serviceMonitor:
    enabled: false
    interval: 30s
  corsOrigin: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

existingSecret:
  name: timeyou-runtime
  databaseUrlKey: DATABASE_URL
  internalApiKeyKey: FOCUS_INTERNAL_API_KEY
